# Postgres for the order-platform `postgres` profile, Redis for the P1
# distributed lock + cache (`redis` profile), and Kafka for the P3 event-driven
# Outbox (`kafka` profile).
#
# Minimal (P0 only, just the DB):
#   docker compose up -d db
#
# Full P1 multi-instance stack (Redis + Postgres):
#   docker compose up -d db redis
# Then run 2+ backend instances, all pointing at the same Redis + Postgres:
#   mvn -o spring-boot:run -Dspring-boot.run.arguments="--server.port=8080 --spring.profiles.active=redis,postgres"
#   mvn -o spring-boot:run -Dspring-boot.run.arguments="--server.port=8081 --spring.profiles.active=redis,postgres"
#
# Full P3 event-driven stack (Redis + Postgres + Kafka):
#   docker compose up -d
# Run 2+ instances with --spring.profiles.active=redis,postgres,kafka so each
# instance writes its outbox and a relay pushes OrderCreated to `order-events`.
#
# Env vars here match backend/src/main/resources/application-{postgres,redis,kafka}.yml
# (ORDER_DB_USER / ORDER_DB_PASSWORD / ORDER_DB_URL / REDIS_HOST / REDIS_PORT /
#  spring.kafka.bootstrap-servers -> localhost:9092).
services:
  db:
    image: postgres:16
    container_name: order-platform-db
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    ports:
      - "5432:5432"
    volumes:
      - order-platform-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: order-platform-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # P3: single-node Kafka (KRaft mode, no Zookeeper needed) for the Outbox relay.
  kafka:
    image: bitnami/kafka:3.7
    container_name: order-platform-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

volumes:
  order-platform-pgdata:
