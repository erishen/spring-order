# P4 multi-instance demo: 2 order-svc replicas behind an nginx gateway,
# backed by shared Redis (P1 lock+cache), Postgres (P0 persistence), and
# Kafka (P3 Outbox relay), plus a Prometheus + Grafana monitoring stack.
#
# Bring the whole stack up:
#   docker compose up -d --build
#   # nginx gateway on :80, prometheus on :9090, grafana on :3000
#
# Exercise the gateway (load is spread across both replicas):
#   curl -i -X POST http://localhost/api/orders \
#     -H 'Content-Type: application/json' \
#     -H 'Idempotency-Key: demo-1' \
#     -d '{"userId":"u1","amount":120,"stockId":"DEFAULT","requiredStock":1}'
#   curl http://localhost/api/orders
#
# Watch metrics per replica in Prometheus (targets order-svc-1:8080 / order-svc-2:8080):
#   open http://localhost:9090  ->  status -> targets
# Grafana dashboards (admin/admin): http://localhost:3000
#
# Scale replicas live:
#   docker compose up -d --scale order-svc-1=2 --scale order-svc-2=2 --build
#
# Env vars below match backend/src/main/resources/application-{postgres,redis,kafka}.yml
# (ORDER_DB_* / REDIS_* / KAFKA_BOOTSTRAP_SERVERS).
services:
  db:
    image: postgres:16
    container_name: spring-order-db
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-order}
    ports:
      - "5432:5432"
    volumes:
      - spring-order-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: spring-order-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # P3: single-node Kafka (KRaft mode, no Zookeeper) for the Outbox relay.
  # NOTE: bitnami/kafka is NOT reachable behind the local CN registry mirrors
  # (they only proxy the Docker Hub `library/*` namespace, not user repos like
  # bitnami/*). apache/kafka is reachable via the full-proxy mirrors (daocloud/
  # 1panel), so we use it. Env vars follow the apache/kafka image conventions
  # (no KAFKA_CFG_ prefix; explicit CLUSTER_ID + KAFKA_AUTO_FORMAT for KRaft).
  kafka:
    image: apache/kafka:3.7.1
    container_name: spring-order-kafka
    ports:
      # 只暴露宿主机真正可用的 listener（PLAINTEXT_HOST=localhost:9094）。
      # 9092 是容器内 listener（advertised=kafka:9092），仅在 docker 网络内可达，
      # 映射到宿主机后宿主机客户端连不通（broker 会回 kafka:9092 解析不了），故不映射。
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_FORMAT: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # 单节点 KRaft：内部 topic（__consumer_offsets / 事务状态日志）默认副本数 3，
      # 但只有 1 个 broker 无法满足 → 会一直重试 auto-creation 刷屏。降为 1。
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Replica 1 ----
  order-svc-1:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: redis,postgres,kafka
      ORDER_DB_URL: jdbc:postgresql://db:5432/orderdb
      ORDER_DB_USER: order
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-order}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Replica 2 (same image, shares the same infra) ----
  order-svc-2:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: redis,postgres,kafka
      ORDER_DB_URL: jdbc:postgresql://db:5432/orderdb
      ORDER_DB_USER: order
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-order}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- API gateway (nginx load balancer) ----
  gateway:
    image: nginx:1.27
    container_name: spring-order-gateway
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 用 8090 而非 80：宿主机常已有 nginx 占用 80（如本机已装 nginx/Web 服务），
      # 直接发布 80 会因端口被占而绑定失败，请求落到宿主 nginx 返回 502。
      # 容器内仍监听 80，前端(:18083)经内部网络访问不受影响。
      - "8090:80"
    depends_on:
      - order-svc-1
      - order-svc-2

  # ---- Monitoring ----
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: spring-order-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - order-svc-1
      - order-svc-2

  grafana:
    image: grafana/grafana:11.2.0
    container_name: spring-order-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # P4 frontend: static SPA (pre-built dist) served by nginx, proxying
  # /api and /actuator to the gateway. Exposes the same UI as `npm run dev`.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spring-order-frontend
    ports:
      - "18083:80"
    depends_on:
      - gateway

volumes:
  spring-order-pgdata:
  prometheus-data:
  grafana-data:
