server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history-mode routing: fall back to index.html for client routes.
    location / {
        try_files $uri /index.html;
    }

    # Business API + actuator both go through the P4 nginx gateway (which
    # round-robins the two order-svc replicas). Proxying keeps a single origin
    # so the browser never hits CORS.
    location /api/ {
        proxy_pass http://gateway:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
    }

    location /actuator/ {
        proxy_pass http://gateway:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
    }
}
