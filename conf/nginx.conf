# P4 API gateway: a thin nginx reverse proxy that load-balances two
# order-svc replicas. The replicas share Redis + Postgres + Kafka (see
# docker-compose.yml) and stay horizontally scalable behind this single entry.

# Round-robin pool of backend replicas.
# Open-source nginx only does *passive* health checks: an instance is pulled
# from rotation after 3 failed attempts within fail_timeout, then retried.
upstream order-svc {
    server order-svc-1:8080 max_fails=3 fail_timeout=30s;
    server order-svc-2:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;

    # Single entry point for the whole backend (business routes + actuator).
    location / {
        proxy_pass http://order-svc;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
    }
}
