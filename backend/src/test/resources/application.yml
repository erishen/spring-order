# Test datasource: in-memory H2 so each test context starts fresh and does not
# pollute the file-based dev database under backend/data/.
spring:
  datasource:
    url: jdbc:h2:mem:ordertest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: none
  h2:
    console:
      enabled: false
