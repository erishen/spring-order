server:
  port: 8080

spring:
  application:
    name: order-platform
  # ---- P0: persistence (default dev datasource = embedded H2, zero infra) ----
  datasource:
    url: jdbc:h2:file:./data/orderdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none          # schema owned by Flyway, not Hibernate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true          # http://localhost:8080/h2-console
