server:
  port: 8080

spring:
  application:
    name: spring-order
  # ---- P0: persistence (default dev datasource = embedded H2, zero infra) ----
  datasource:
    url: jdbc:h2:file:./data/orderdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none          # schema owned by Flyway, not Hibernate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false         # 默认关闭；本地开发经 dev profile 开启（见 application-dev.yml）
  # 本地默认激活 dev profile（开启 H2 控制台）。容器/生产部署通过
  # SPRING_PROFILES_ACTIVE 覆盖，不会激活 dev，h2-console 保持关闭。
  profiles:
    default: dev

# ---- P2: reliability (Resilience4j) ----
resilience4j:
  ratelimiter:
    instances:
      orderCreate:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
  circuitbreaker:
    instances:
      orderCreate:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # expected business rejections must NOT count toward the failure rate
        ignore-exceptions:
          - com.example.order.exception.InsufficientStockException
  retry:
    instances:
      orderCreate:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.dao.OptimisticLockingFailureException
          - org.springframework.dao.DataAccessException
        ignore-exceptions:
          - com.example.order.exception.InsufficientStockException
          - com.example.order.exception.IdempotencyConflictException

# ---- P4: Observability (Actuator + Prometheus) ----
# 仅暴露 health/info/prometheus：health 供网关健康检查，prometheus 供监控栈抓取
# （见 docker-compose + prometheus.yml），info 仅含 instanceId。metrics 明细端点已去除。
# 生产部署见 application-prod.yml：仅暴露 health，prometheus 走独立 management 端口。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  # Redis 健康指示器由 classpath 上的 data-redis 自动注册（与 RedisConfig 的
  # @ConditionalOnProperty 无关），无 Redis 时恒 ping 失败 → 顶层 health 误报 DOWN。
  # 默认关闭，仅 redis profile 启用（见 application-redis.yml）。
  health:
    redis:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: spring-order
