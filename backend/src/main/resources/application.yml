server:
  port: 8080

spring:
  application:
    name: order-platform
  # ---- P0: persistence (default dev datasource = embedded H2, zero infra) ----
  datasource:
    url: jdbc:h2:file:./data/orderdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none          # schema owned by Flyway, not Hibernate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true          # http://localhost:8080/h2-console

# ---- P2: reliability (Resilience4j) ----
resilience4j:
  ratelimiter:
    instances:
      orderCreate:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
  circuitbreaker:
    instances:
      orderCreate:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # expected business rejections must NOT count toward the failure rate
        ignore-exceptions:
          - com.example.order.exception.InsufficientStockException
  retry:
    instances:
      orderCreate:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.dao.OptimisticLockingFailureException
          - org.springframework.dao.DataAccessException
        ignore-exceptions:
          - com.example.order.exception.InsufficientStockException
          - com.example.order.exception.IdempotencyConflictException
